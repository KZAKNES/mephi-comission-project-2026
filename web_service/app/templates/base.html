<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title | default("LLM Web Service") }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #20242c;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      header {
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.15;
      }

      p {
        line-height: 1.55;
      }

      form, .panel {
        background: #ffffff;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 8px 22px rgba(21, 28, 38, 0.06);
      }

      label {
        display: block;
        font-weight: 650;
        margin: 16px 0 8px;
      }

      input, textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #b9c1ce;
        border-radius: 6px;
        padding: 11px 12px;
        font: inherit;
      }

      textarea {
        min-height: 150px;
        resize: vertical;
      }

      button, .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        margin-top: 18px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        background: #126a63;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      form {
        margin-top: 18px;
      }

      .error, .notice {
        margin: 0 0 16px;
        padding: 12px;
        border-radius: 6px;
      }

      .error {
        background: #fff1f0;
        color: #8a1f11;
        border: 1px solid #ffc9c2;
      }

      .notice {
        background: #edf8f5;
        color: #145c50;
        border: 1px solid #a9ddd2;
      }

      .meta {
        color: #5b6573;
        font-size: 14px;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
